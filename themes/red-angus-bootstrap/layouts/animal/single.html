{{ define "main" }}
  {{ $data := newScratch }}
  {{ $data.Set "records" $.Site.Data.allData }}
  <pre></pre>
  <main class="container animal" id="app">
    <header>
      <div class="back-to-sale">
        <a :href="saleLink">Back to ${saleYear} Sale</a>
      </div>
      <template v-if="hasRecord">
        <h1 class="title">Lot ${ fields.lot } - ${ fields.name }</h1>
        <nav>
          <a v-if="prev" class="btn btn-outline-primary" :href="prevLink"
            >Previous Lot</a
          >
          <span class="spacer"></span>
          <a v-if="next" class="btn btn-outline-primary" :href="nextLink"
            >Next Lot</a
          >
        </nav>
      </template>
      <h1 class="title" v-else>No Animal Found</h1>
    </header>
    <template v-if="hasRecord">
      <div class="video-container" v-if="fields['video_id']">
        <iframe
          :src="videoURL"
          title="vimeo/youtube video"
          webkitallowfullscreen
          mozallowfullscreen
          allowfullscreen
        ></iframe>
      </div>
      <div v-else>No video available.</div>
      <h2>EPDs</h2>
      <section class="epds">
        <div class="epd" v-for="display in displayFields">
          <div class="head">${ display.title }</div>
          <div class="value">
            ${ fields[display.field || display.title] }&nbsp;
          </div>
        </div>
      </section>

      <h2>Explore Lots</h2>
      <div class="lot-list">
        <a
          class="btn"
          v-for="lot in lots"
          :href="lot.link"
          :class="{'btn-outline-primary':lot.current, 'btn-primary': !lot.current}"
          >${ lot.lot }</a
        >
      </div>
    </template>
  </main>

  <script src="https://unpkg.com/vue@3"></script>
<script>
    // eslint-disable-next-line
    const allRecords = {{ $data.Get "records" | jsonify | safeJS }};
    const urlParams = new URLSearchParams(window.location.search);
    const reg = urlParams.get('reg');
    const record = allRecords[reg]; //.find(r => r?.fields['Reg #'] === +reg);
    const saleYear = record?.['sale_year'] || urlParams.get('sale_year') || '{{ $.Site.Params.sale_year }}';
    const records = Object.keys(allRecords).map(key => allRecords[key]).filter(r => +r?.['sale_year'] === +saleYear && r?.['lot']);
    const lotCompare = (a,b) => +a['lot'] - +b['lot'];
    records.sort(lotCompare);
    const prev = records.find(r => r?.['lot'] === record?.['lot'] - 1);
    const next = records.find(r => r?.['lot'] === record?.['lot'] + 1);

    const displayFields = [
        {title: 'Lot #', field: 'lot'},
        {title: 'Tag', field: 'animal_id'},
        {title: 'Registration #', field: 'reg'},
        {title: 'Sex', field: 'sex'},
        {title: 'Birthdate', field: 'birth_date'},
        {title: 'ProS', field: 'pro_s'},
        {title: 'HB', field: 'hb'},
        {title: 'GM', field: 'gm'},
        {title: 'CED', field: 'ced'},
        {title: 'BW', field: 'bw'},
        {title: 'WW', field: 'ww'},
        {title: 'YW', field: 'yw'},
        {title: 'ADG', field: 'adg'},
        {title: 'DMI', field: 'dmi'},
        {title: 'Milk', field: 'milk'},
        {title: 'ME', field: 'me'},
        {title: 'HPG', field: 'hpg'},
        {title: 'CEM', field: 'cem'},
        {title: 'Stay', field: 'stay'},
        {title: 'Marb', field: 'marb'},
        {title: 'YG', field: 'yg'},
        {title: 'CW', field: 'cw'},
        {title: 'RE', field: 're'},
        {title: 'BF', field: 'bf'},
    ]

    const videoURLs ={
        vimeo: 'https://player.vimeo.com/video/{}',
        youtube: 'https://www.youtube.com/embed/{}?autoplay=1'
    };

    const app = Vue.createApp({
        data() {
            return {hasRecord: !!record, fields: record, displayFields, prev, next, records, saleYear}
        },
        computed: {
            prevLink() {
                if (!this.prev) return '';
                const url = new URL(window.location)
                url.searchParams.set('reg', this.prev.reg)
                return url.toString();
            },
            nextLink() {
                if (!this.next) return '';
                const url = new URL(window.location)
                url.searchParams.set('reg', this.next?.reg)
                return url.toString();
            },
            videoURL() {
                if (!this.video_id && !this.video_type) return '';
                const video_id = this.video_id;
                const url = videoURLs[this.video_type];
                return url.replace('{}',video_id);
            },
            saleLink() {
                const endpoint = this.fields.sex === 'C' ? 'heifers' : 'bulls';
                return `/sales/${saleYear}/${endpoint}`
            },
            lots() {
                if(!records) return [];
                console.log(records,'*****')
                console.log(records[0].lot)
                return records.filter(r => !!r.lot)
                    .map(r => {
                        const url = new URL(window.location)
                        url.searchParams.set('reg', r.reg)
                        return ({
                            lot: r.lot,
                            current: r.reg === record.reg,
                            link: url.toString()
                        });
                    })
            }
        },
        compilerOptions: {
            delimiters: ['${', '}']
        }
    }).mount('#app');

</script>
  <script></script>
{{ end }}
